[package]
name = "password_keeper"
version = "0.1.0"
edition = "2024"
description = "A secure, minimalist CLI password manager with per-record cryptographic isolation."
authors = ["Vitalii K <masterarrows@gmail.com>"]
license = "MIT"
repository = "https://github.com/masterarrow/password_keeper"
readme = "README.md"
keywords = ["password-manager", "cli", "security", "zero-knowledge"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm = "0.11.1"
arboard = "3.6.1"
argon2 = "0.6.0"
base64 = "0.23.1"
comfy-table = "8.0.1"
console = "0.16.6"
dialoguer = "0.12.0"
rand = "0.10.3"
rpassword = "7.5.4"
secrecy = "0.10.3"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
zeroize = "1.9.0"
